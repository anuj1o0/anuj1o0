<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" role="presentation">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5BE0C8" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#25384E" stop-opacity="1"/>
      <stop offset="88%"  stop-color="#25384E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5BE0C8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5BE0C8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#5BE0C8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5BE0C8" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { .p { display: none; } }
  </style>

  <rect x="0" y="6.5" width="1200" height="1" fill="url(#hair)"/>

  <g class="p" filter="url(#g)">
    <rect x="-220" y="5.5" width="220" height="3" fill="url(#pulse)">
      <animate attributeName="x" from="-220" to="1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
