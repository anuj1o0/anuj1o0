<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 118" width="1200" height="118" role="img" aria-label="90+ hours saved monthly, 20+ bank formats parsed, 30+ root cause analyses, 650+ problems solved">

  <defs>
    <clipPath id="strip"><rect x="0" y="0" width="1200" height="118" rx="14"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0C1523"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .cell { opacity: 0; animation: up .6s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes up { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .cell { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <g clip-path="url(#strip)">
    <rect width="1200" height="118" fill="url(#bg)"/>

    <!-- hairline tick ruler across the top -->
    <g stroke="#1B283A" stroke-width="1">
      <path d="M0 22 H1200"/>
    </g>
    <g fill="#1E2B3D">
      <rect x="40"  y="16" width="1" height="6"/><rect x="90"  y="18" width="1" height="4"/>
      <rect x="140" y="18" width="1" height="4"/><rect x="190" y="18" width="1" height="4"/>
      <rect x="240" y="16" width="1" height="6"/><rect x="290" y="18" width="1" height="4"/>
      <rect x="340" y="18" width="1" height="4"/><rect x="390" y="18" width="1" height="4"/>
      <rect x="440" y="16" width="1" height="6"/><rect x="490" y="18" width="1" height="4"/>
      <rect x="540" y="18" width="1" height="4"/><rect x="590" y="18" width="1" height="4"/>
      <rect x="640" y="16" width="1" height="6"/><rect x="690" y="18" width="1" height="4"/>
      <rect x="740" y="18" width="1" height="4"/><rect x="790" y="18" width="1" height="4"/>
      <rect x="840" y="16" width="1" height="6"/><rect x="890" y="18" width="1" height="4"/>
      <rect x="940" y="18" width="1" height="4"/><rect x="990" y="18" width="1" height="4"/>
      <rect x="1040" y="16" width="1" height="6"/><rect x="1090" y="18" width="1" height="4"/>
      <rect x="1140" y="18" width="1" height="4"/>
    </g>

    <!-- dividers -->
    <g fill="#16202F">
      <rect x="300" y="40" width="1" height="52"/>
      <rect x="600" y="40" width="1" height="52"/>
      <rect x="900" y="40" width="1" height="52"/>
    </g>

    <g class="cell" style="transform:translateY(8px); animation-delay:.05s">
      <text x="42" y="76" class="sans" font-size="34" font-weight="600" fill="#E8EEF6" letter-spacing="-1">90+</text>
      <text x="42" y="96" class="mono" font-size="10" fill="#5BE0C8" letter-spacing="2.4">HOURS RECLAIMED / MONTH</text>
    </g>

    <g class="cell" style="transform:translateY(8px); animation-delay:.15s">
      <text x="342" y="76" class="sans" font-size="34" font-weight="600" fill="#E8EEF6" letter-spacing="-1">20+</text>
      <text x="342" y="96" class="mono" font-size="10" fill="#5BE0C8" letter-spacing="2.4">BANK FORMATS PARSED</text>
    </g>

    <g class="cell" style="transform:translateY(8px); animation-delay:.25s">
      <text x="642" y="76" class="sans" font-size="34" font-weight="600" fill="#E8EEF6" letter-spacing="-1">30+</text>
      <text x="642" y="96" class="mono" font-size="10" fill="#5BE0C8" letter-spacing="2.4">ROOT CAUSE ANALYSES</text>
    </g>

    <g class="cell" style="transform:translateY(8px); animation-delay:.35s">
      <text x="942" y="76" class="sans" font-size="34" font-weight="600" fill="#E8EEF6" letter-spacing="-1">650+</text>
      <text x="942" y="96" class="mono" font-size="10" fill="#5BE0C8" letter-spacing="2.4">PROBLEMS SOLVED</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="117" rx="14" fill="none" stroke="#1B283A"/>
  </g>
</svg>
